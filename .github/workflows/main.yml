name: Flutter iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r KurdDesign-AI-IPA.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KurdDesign-AI-IPA
          path: KurdDesign-AI-IPA.ipa
